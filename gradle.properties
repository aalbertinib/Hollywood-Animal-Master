#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 --add-opens=java.base/java.lang.ref=ALL-UNNAMED
# Configuration cache disabled due to incompatibility with Kotlin/JS and Kotlin/Wasm targets
# See: https://youtrack.jetbrains.com/issue/KT-49933
org.gradle.configuration-cache=false
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin/Wasm - Suppress Node.js deprecation warnings (punycode module)
kotlin.js.yarn=false

#Project Version - Single source of truth for all platforms
project.version=1.0.0