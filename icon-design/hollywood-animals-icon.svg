<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" rx="180"/>
  
  <!-- Clapperboard top (striped part) -->
  <g transform="translate(512, 280)">
    <rect x="-280" y="-60" width="560" height="120" fill="#2d2d44" rx="8"/>
    <rect x="-280" y="-60" width="70" height="120" fill="url(#goldGrad)"/>
    <rect x="-190" y="-60" width="70" height="120" fill="#1a1a2e"/>
    <rect x="-100" y="-60" width="70" height="120" fill="url(#goldGrad)"/>
    <rect x="-10" y="-60" width="70" height="120" fill="#1a1a2e"/>
    <rect x="80" y="-60" width="70" height="120" fill="url(#goldGrad)"/>
    <rect x="170" y="-60" width="110" height="120" fill="#1a1a2e"/>
  </g>
  
  <!-- Clapperboard bottom -->
  <rect x="232" y="340" width="560" height="420" fill="#f0f0f0" rx="8"/>
  <rect x="242" y="350" width="540" height="400" fill="#ffffff" rx="4"/>
  
  <!-- Paw print in center -->
  <g transform="translate(512, 560)" fill="#ff6b6b">
    <!-- Main pad -->
    <ellipse cx="0" cy="20" rx="70" ry="85"/>
    <!-- Top left toe -->
    <ellipse cx="-55" cy="-50" rx="35" ry="50" transform="rotate(-15 -55 -50)"/>
    <!-- Top center toe -->
    <ellipse cx="0" cy="-60" rx="35" ry="50"/>
    <!-- Top right toe -->
    <ellipse cx="55" cy="-50" rx="35" ry="50" transform="rotate(15 55 -50)"/>
    <!-- Side toe -->
    <ellipse cx="-85" cy="10" rx="30" ry="45" transform="rotate(-25 -85 10)"/>
  </g>
  
  <!-- Shadow effect -->
  <rect x="232" y="755" width="560" height="5" fill="#000000" opacity="0.1" rx="2"/>
</svg>
