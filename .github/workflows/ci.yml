name: CI

on:
  push:
    branches: [ main, develop ]
    tags-ignore: [ '**' ]  # Don't run on tags (release workflow handles those)
  pull_request:
    types: [ opened, synchronize, reopened ]

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  # Fast validation - tests first
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests
      run: ./gradlew :composeApp:testReleaseUnitTest --stacktrace
      
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          **/build/test-results/**/*.xml
          **/build/reports/**
        retention-days: 3

  # Parallel validation builds - fast feedback
  validate:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
            task: :composeApp:assembleDebug
          - target: Desktop
            os: ubuntu-latest
            task: :composeApp:compileKotlinJvm
          - target: Web
            os: ubuntu-latest
            task: :composeApp:wasmJsBrowserDistribution
    
    env:
      NODE_OPTIONS: --no-deprecation
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Upgrade Package Lock (Web only)
      if: matrix.target == 'Web'
      run: ./gradlew kotlinUpgradePackageLock kotlinWasmUpgradePackageLock --no-build-cache --rerun-tasks
      
    - name: Build ${{ matrix.target }}
      run: ./gradlew ${{ matrix.task }} --stacktrace
