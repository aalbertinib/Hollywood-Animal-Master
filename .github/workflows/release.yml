name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  APP_NAME: hollywood-animals-master
  JAVA_VERSION: '17'

jobs:
  build-desktop:
    name: Build Desktop (Windows, macOS, Linux)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux-x64
          - os: windows-latest
            platform: windows
            artifact_name: windows-x64
          - os: macos-latest
            platform: macos
            artifact_name: macos-x64
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew (Unix)
      if: runner.os != 'Windows'
      run: chmod +x gradlew
      
    - name: Build Desktop JAR
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./gradlew.bat :composeApp:packageDistributionForCurrentOS --no-daemon
        else
          ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon
        fi
      
    - name: Package Desktop App
      shell: bash
      run: |
        VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
        cd composeApp/build/compose/binaries/main
        if [ "$RUNNER_OS" == "Windows" ]; then
          7z a -tzip "${{ env.APP_NAME }}-${VERSION}-${{ matrix.artifact_name }}.zip" *
        else
          zip -r "${{ env.APP_NAME }}-${VERSION}-${{ matrix.artifact_name }}.zip" *
        fi
        
    - name: Upload Desktop Build
      uses: actions/upload-artifact@v4
      with:
        name: desktop-${{ matrix.artifact_name }}
        path: composeApp/build/compose/binaries/main/*.zip
        retention-days: 30
        
    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: composeApp/build/compose/binaries/main/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Android Release APK
      run: ./gradlew :composeApp:assembleRelease --no-daemon
      
    - name: Sign APK (if keystore available)
      id: sign_apk
      continue-on-error: true
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          ./gradlew :composeApp:assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          echo "signed=true" >> $GITHUB_OUTPUT
        else
          echo "signed=false" >> $GITHUB_OUTPUT
        fi
      
    - name: Rename APK
      run: |
        VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
        cd composeApp/build/outputs/apk/release
        if [ "${{ steps.sign_apk.outputs.signed }}" == "true" ]; then
          mv *.apk "${{ env.APP_NAME }}-${VERSION}-release-signed.apk"
        else
          mv *.apk "${{ env.APP_NAME }}-${VERSION}-release-unsigned.apk"
        fi
        
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-release
        path: composeApp/build/outputs/apk/release/*.apk
        retention-days: 30
        
    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: composeApp/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build Web (WASM)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Web WASM
      run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon
      
    - name: Package Web Build
      run: |
        VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
        cd composeApp/build/dist/wasmJs/productionExecutable
        zip -r "${{ env.APP_NAME }}-${VERSION}-web.zip" *
        
    - name: Upload Web Build
      uses: actions/upload-artifact@v4
      with:
        name: web-wasm
        path: composeApp/build/dist/wasmJs/productionExecutable/*.zip
        retention-days: 30
        
    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: composeApp/build/dist/wasmJs/productionExecutable/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release-notes:
    name: Create Release Summary
    needs: [build-desktop, build-android, build-web]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Update Release Notes
      uses: softprops/action-gh-release@v1
      with:
        append_body: true
        body: |
          
          ---
          
          ## 📦 Available Downloads
          
          ### 🖥️ Desktop Applications
          - **Windows (x64)**: `hollywood-animals-master-*-windows-x64.zip`
          - **macOS (x64)**: `hollywood-animals-master-*-macos-x64.zip`
          - **Linux (x64)**: `hollywood-animals-master-*-linux-x64.zip`
          
          ### 📱 Mobile
          - **Android**: `hollywood-animals-master-*-release.apk`
          
          ### 🌐 Web
          - **WASM**: `hollywood-animals-master-*-web.zip` (extract and host on web server)
          - **Live Demo**: Available on [GitHub Pages](https://<username>.github.io/Hollywood-Animals-Master/)
          
          ---
          
          Built with Kotlin Multiplatform & Compose Multiplatform 🎬
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
